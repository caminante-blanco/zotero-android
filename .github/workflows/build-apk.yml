name: Build Zotero Read Aloud APK

on:
  workflow_dispatch:
  schedule:
    - cron: 0 4 batch_transcribe.py lindsay_clancy_documents llama.cpp llama_shallow onnx_parakeet oracle_key.key qwen3-asr-1.7b-int4 storage test_16k.wav test_out.txt batch_transcribe.py lindsay_clancy_documents llama.cpp llama_shallow onnx_parakeet oracle_key.key qwen3-asr-1.7b-int4 storage test_16k.wav test_out.txt *
  push:
    branches:
      - read_aloud

permissions:
  contents: write

jobs:
  sync_and_build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Sync upstream changes (if scheduled)
        if: github.event_name == schedule
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/zotero/zotero-android.git
          git fetch upstream read_aloud
          git merge upstream/read_aloud --no-edit || git reset --hard upstream/read_aloud
          git submodule update --init --recursive
          git push origin read_aloud || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Bundle Assets and Workers
        run: |
          chmod +x scripts/*
          python3 scripts/bundle_translators.py
          python3 scripts/bundle_translation.py
          python3 scripts/bundle_pdf-worker.py
          python3 scripts/bundle_citation_proc.py
          python3 scripts/bundle_csl_locales.py
          python3 scripts/bundle_styles.py
          ./scripts/bundle_utilities.sh
          ./scripts/bundle_reader.sh
          ./scripts/bundle_document_worker.sh

      - name: Build DevDebug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDevDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zotero-read-aloud-devDebug
          path: app/build/outputs/apk/dev/debug/*.apk
          retention-days: 14

      - name: Release APK
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.0-tts-${{ github.run_number }}"
          name: "Zotero TTS Build #${{ github.run_number }}"
          files: app/build/outputs/apk/dev/debug/*.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
