name: Build Zotero Read Aloud APK

on:
  workflow_dispatch:
  push:
    branches:
      - read_aloud

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.10

      - name: Bundle Assets and Workers
        run: |
          chmod +x scripts/*
          python3 scripts/bundle_translators.py
          python3 scripts/bundle_translation.py
          python3 scripts/bundle_pdf-worker.py
          python3 scripts/bundle_citation_proc.py
          python3 scripts/bundle_csl_locales.py
          python3 scripts/bundle_styles.py
          ./scripts/bundle_utilities.sh
          ./scripts/bundle_reader.sh
          ./scripts/bundle_document_worker.sh

      - name: Build DevDebug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDevDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zotero-read-aloud-devDebug
          path: app/build/outputs/apk/dev/debug/*.apk
          retention-days: 14

      - name: Release APK
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.0-tts-${{ github.run_number }}"
          name: "Zotero TTS Build #${{ github.run_number }}"
          files: app/build/outputs/apk/dev/debug/*.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
